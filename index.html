function lsSaveLocal(data){try{localStorage.setItem(LS_KEY,JSON.stringify({...data,_at:new Date().toISOString()}));return true;}catch(e){return false;}}

async function supaCargar(){
  try{
    const r=await fetch(SUPA_URL+"/rest/v1/datos_dashboard?id=eq.principal&select=contenido,actualizado_en",{
      headers:{"apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY}
    });
    if(!r.ok) return null;
    const d=await r.json();
    if(d&&d[0]&&d[0].contenido&&Object.keys(d[0].contenido).length>0){
      return {...d[0].contenido, _at: d[0].actualizado_en};
    }
    return null;
  }catch(e){return null;}
}

async function supaGuardar(data){
  try{
    const r=await fetch(SUPA_URL+"/rest/v1/datos_dashboard?id=eq.principal",{
      method:"PATCH",
      headers:{"apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json","Prefer":"return=minimal"},
      body:JSON.stringify({contenido:data, actualizado_en:new Date().toISOString()})
    });
    return r.ok;
  }catch(e){return false;}
}

// FUSIÓN: Combina datos del usuario con nuevos aliados sin duplicados
function fusionarAliadosNuevos(aliadosExistentes){
  const idsExistentes=new Set(aliadosExistentes.map(a=>a.id));
  const todosAliados=[...aliadosExistentes];
  ALIADOS_CONFIRMADOS.forEach(a=>{if(!idsExistentes.has(a.id))todosAliados.push(a);});
  ALIADOS_GESTION.forEach(a=>{if(!idsExistentes.has(a.id))todosAliados.push(a);});
  ALIADOS_CONTACTOS.forEach(a=>{if(!idsExistentes.has(a.id))todosAliados.push(a);});
  return todosAliados;
}

function colorAliado(aliados,id){

function getCalendarWeeks(anio,mes){
  const primerDia=new Date(anio,mes,1);
  let inicio=primerDia.getDay(); // 0=Dom..6=Sab
  inicio=(inicio+6)%7; // 0=Lun..6=Dom
  const diasEnMes=new Date(anio,mes+1,0).getDate();
  const celdas=[];
  for(let i=0;i<inicio;i++) celdas.push(null);
  for(let d=1;d<=diasEnMes;d++) celdas.push(d);
  while(celdas.length%7!==0) celdas.push(null);
  const semanas=[];
  for(let i=0;i<celdas.length;i+=7) semanas.push(celdas.slice(i,i+7));
  return semanas;
}

            valor={estancados.length}

            bg={estancados.length>0?"#fff1f2":"#f0f7eb"}
            desc="Aliados en gestión, revisión o formalización sin actualización de contacto en más de 30 días. Requieren acción inmediata."

          <KpiCard
            valor={etapaCuello.lista.length>0?etapaCuello.label:"—"}

            desc="Etapa del programa con más aliados acumulados. Si es alta, hay un cuello de botella que requiere gestión."/>
          <KpiCard
            valor={tasaConvProg+"%"}
            label="Tasa de conversión del programa"
            sub={progConfirmados.length+" activos de "+programa.length+" en el programa"}
            color={tasaConvProg>=30?VERDE:tasaConvProg>=15?NARANJA:"#ef4444"}
            bg={tasaConvProg>=30?"#f0f7eb":tasaConvProg>=15?"#fff7f0":"#fff1f2"}
            desc="Porcentaje de aliados del programa que llegaron a Confirmado. Meta sugerida: +30%."/>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
          {/* Embudo por etapa con porcentajes */}
          <Panel>
            <PanelTitle sub="¿En qué etapa hay más aliados acumulados? Barras más largas = mayor acumulación.">Distribución por etapa del programa</PanelTitle>
            {ETAPAS_PROG.map(({label,color,lista})=>{
              const pct=Math.round((lista.length/totalProg)*100);
              const esCuello=etapaCuello.label===label&&lista.length>0;
              return(
                <div key={label} style={{marginBottom:10}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                    <span style={{fontSize:12,fontWeight:600,color:"#333",display:"flex",alignItems:"center",gap:6}}>
                      {label}
                      {esCuello&&<span style={{fontSize:9,fontWeight:700,background:"#fee2e2",color:"#dc2626",padding:"1px 6px",borderRadius:10}}>cuello</span>}
                    </span>
                    <span style={{fontSize:12,fontWeight:800,color}}>{lista.length} <span style={{fontSize:10,color:"#aaa",fontWeight:400}}>({pct}%)</span></span>
                  </div>
                  <div style={{background:"#f0f0f0",borderRadius:6,height:10,overflow:"hidden"}}>
                    <div style={{background:color,width:pct+"%",height:"100%",borderRadius:6,transition:"width .5s",

                </div>

          </Panel>

          {/* Tasa de conversión por etapa */}

            {estancados.length>0&&(

                    <span style={{color:"#ef4444",fontWeight:600,flexShrink:0}}>{a.estado} · {a.fechaUltimoContacto?"hace "+(Math.floor((hoyMs2-new Date(a.fechaUltimoContacto).getTime())/(1000*60*60*24)))+"d":"sin fecha"}</span>

                {estancados.length>4&&<div style={{fontSize:10,color:"#aaa",marginTop:4}}>+{estancados.length-4} más — revisar en el Directorio</div>}

          </Panel>
        </div>
      </div>

    </div>
    );
  })()}

    {/* ══════ TAB CALENDARIO ══════ */}

            {calAliados.map(a=>(
              editAliadoId===a.id?(
                <input key={a.id} autoFocus value={editAliadoNombre} onChange={e=>setEditAliadoNombre(e.target.value)}

                  style={{width:"100%",padding:"9px 12px",background:colorAliado(calAliados,a.id),border:"none",borderBottom:"1px solid rgba(0,0,0,.06)",fontSize:11,fontWeight:700,color:"#333",outline:"2px solid "+PURP,outlineOffset:-2}}/>

                  <span onClick={()=>iniciarEdicionAliado(a)} title="Clic para editar el nombre" style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",cursor:"pointer",flex:1}}>{a.nombre}</span>

                placeholder="Nombre del aliado..." style={{width:"100%",padding:"9px 12px",border:"none",borderBottom:"1px solid #eee",fontSize:11,fontWeight:600,outline:"2px solid "+PURP,outlineOffset:-2}}/>

      const hoyMs=new Date().getTime();

        if(!fechaUlt)return{color:"#bbb",label:"Sin contacto"};
        const dias=Math.floor((hoyMs-new Date(fechaUlt).getTime())/(1000*60*60*24));
        if(dias<=7) return{color:"#22c55e",label:`Hace ${dias}d`};

        return{color:"#ef4444",label:`Hace ${dias}d`};
      };
      return(
      <div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:8}}>

            <div style={{fontSize:10,color:"#aaa",marginBottom:10,fontStyle:"italic"}}>¿Qué tipo de actividad predomina este mes?</div>
            {tipoEntries.length===0?(
              <p style={{fontSize:11,color:"#bbb",padding:"12px 0"}}>Sin actividades registradas este mes</p>
            ):tipoEntries.map(([tipo,n])=>(
              <div key={tipo} style={{marginBottom:8}}>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"#555",marginBottom:3,fontWeight:600}}>
                  <span>{tipo}</span><span style={{color:PURP,fontWeight:800}}>{n}</span>
                </div>
                <div style={{height:7,background:"#ebebeb",borderRadius:6,overflow:"hidden"}}>
                  <div style={{height:"100%",width:Math.round((n/maxTipo)*100)+"%",background:PURP,borderRadius:6}}/>
                </div>
              </div>
            ))}
          </div>

          <div style={{border:"1px solid #e5e5e5",borderRadius:10,padding:14}}>
            <div style={{fontSize:12,fontWeight:700,color:"#333",marginBottom:4}}>Visitas por aliado</div>
            <div style={{fontSize:10,color:"#aaa",marginBottom:10,fontStyle:"italic"}}>¿Con qué aliados hubo más actividad este mes?</div>
            {contactoEntries.length===0?(
              <p style={{fontSize:11,color:"#bbb",padding:"12px 0"}}>Sin visitas registradas este mes</p>
            ):contactoEntries.map(([nombre,n])=>(
              <div key={nombre} style={{marginBottom:8}}>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"#555",marginBottom:3,fontWeight:600}}>
                  <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:"75%"}}>{nombre}</span>
                  <span style={{color:AZUL,fontWeight:800}}>{n}</span>
                </div>
                <div style={{height:7,background:"#ebebeb",borderRadius:6,overflow:"hidden"}}>
                  <div style={{height:"100%",width:Math.round((n/maxContacto)*100)+"%",background:AZUL,borderRadius:6}}/>
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* Tendencia + Próximas */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:20}}>
          <div style={{border:"1px solid #e5e5e5",borderRadius:10,padding:14}}>
            <div style={{fontSize:12,fontWeight:700,color:"#333",marginBottom:4}}>Tendencia de actividad</div>
            <div style={{fontSize:10,color:"#aaa",marginBottom:10,fontStyle:"italic"}}>¿El programa está creciendo en visitas?</div>
            <div style={{display:"flex",alignItems:"flex-end",gap:6,height:80}}>
              {tendencia.map((t,i)=>(
                <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"flex-end",height:"100%"}}>
                  <div style={{fontSize:10,fontWeight:800,color:PURP,marginBottom:2}}>{t.total||""}</div>
                  <div style={{width:"70%",background:"linear-gradient(180deg,"+PURP+",#a78bfa)",borderRadius:"4px 4px 0 0",height:t.total>0?Math.round((t.total/maxTend)*64)+"px":"2px",minHeight:2,opacity:i===5?1:.65}}/>
                  <div style={{fontSize:9,color:"#999",marginTop:3}}>{MESES[t.m].slice(0,3)}</div>
                </div>
              ))}
            </div>
          </div>

          <div style={{border:"1px solid #e5e5e5",borderRadius:10,padding:14}}>
            <div style={{fontSize:12,fontWeight:700,color:"#333",marginBottom:4}}>📅 Próximas visitas</div>
            <div style={{fontSize:10,color:"#aaa",marginBottom:10,fontStyle:"italic"}}>Visitas programadas pendientes de realizar</div>
            {proximas.length===0?(
              <p style={{fontSize:11,color:"#bbb",padding:"8px 0"}}>No hay visitas programadas a futuro</p>
            ):proximas.map(v=>{
              const d=directorio.find(x=>x.id===v.aliadoId);
              return(
                <div key={v.id} onClick={()=>setVisitaViendo(v)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:"1px solid #f5f5f5",cursor:"pointer"}}>
                  <div>
                    <div style={{fontSize:11,fontWeight:700,color:"#333"}}>{d?d.empresa:"?"}</div>
                    <div style={{fontSize:10,color:"#999"}}>{v.tipoActividad}{v.ciudad?" · "+v.ciudad:""}</div>
                  </div>
                  <span style={{fontSize:10,fontWeight:600,color:AZUL,flexShrink:0,marginLeft:8}}>{v.fecha}</span>
                </div>
              );
            })}
          </div>
        </div>

        {/* Historial por contacto */}
        <div style={{borderTop:"1px solid #eee",paddingTop:16}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
            <div>
              <h3 style={{fontSize:13,fontWeight:700,color:"#333",marginBottom:2}}>Historial por contacto</h3>
              <p style={{fontSize:10,color:"#aaa"}}>Selecciona un contacto para ver y registrar sus visitas</p>
            </div>
            {aliadoSel&&<button onClick={()=>abrirNuevaVisita(aliadoSel.id)} style={{background:PURP,color:"white",border:"none",padding:"8px 14px",borderRadius:7,fontSize:12,fontWeight:600,cursor:"pointer"}}>+ Registrar visita</button>}
          </div>

          {/* Selector de contacto */}
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:14}}>
            {contactosProg.filter(d=>visitasDe(d.id).length>0||d.estado==="Confirmado"||d.estado==="En Gestión"||d.estado==="En Revisión"||d.estado==="En Formalización").map(d=>(
              <button key={d.id} onClick={()=>setVisSelAliadoId(d.id)}
                style={{padding:"5px 12px",borderRadius:20,border:"1.5px solid "+(aliadoSel&&aliadoSel.id===d.id?PURP:"#ddd"),background:aliadoSel&&aliadoSel.id===d.id?PURP:"white",color:aliadoSel&&aliadoSel.id===d.id?"white":"#666",fontSize:11,fontWeight:600,cursor:"pointer"}}>
                {d.empresa||"(sin nombre)"}
                {visitasDe(d.id).length>0&&<span style={{marginLeft:5,background:"rgba(255,255,255,.25)",padding:"1px 6px",borderRadius:10,fontSize:9}}>{visitasDe(d.id).length}</span>}
              </button>
            ))}
            {contactosProg.filter(d=>visitasDe(d.id).length>0||d.estado==="Confirmado"||d.estado==="En Gestión"||d.estado==="En Revisión"||d.estado==="En Formalización").length===0&&(
              <p style={{fontSize:11,color:"#bbb"}}>Agrega contactos al Programa de Aliados para registrar visitas.</p>
            )}
          </div>

          {/* Historial del contacto seleccionado */}
          {aliadoSel&&(
            <div>
              <div style={{display:"flex",gap:8,marginBottom:10}}>
                <div style={{background:"#faf7ff",borderRadius:8,padding:"8px 14px",textAlign:"center",minWidth:80}}>
                  <div style={{fontSize:18,fontWeight:900,color:PURP}}>{visSel.length}</div>
                  <div style={{fontSize:9,color:"#999"}}>Total visitas</div>
                </div>
                <div style={{background:"#f0f7eb",borderRadius:8,padding:"8px 14px",textAlign:"center",minWidth:80}}>
                  <div style={{fontSize:18,fontWeight:900,color:VERDE}}>{visSel.filter(v=>v.estado==="Finalizada").length}</div>
                  <div style={{fontSize:9,color:"#999"}}>Finalizadas</div>
                </div>
                <div style={{background:"#e8f1fb",borderRadius:8,padding:"8px 14px",textAlign:"center",minWidth:80}}>
                  <div style={{fontSize:18,fontWeight:900,color:AZUL}}>{visSel.filter(v=>v.estado==="Programada").length}</div>
                  <div style={{fontSize:9,color:"#999"}}>Programadas</div>
                </div>
              </div>
              <div style={{display:"grid",gap:6}}>
                {visSel.map(v=>{
                  const est=COLS_ESTADO[v.estado]||{bg:"#f0f0f0",color:"#555"};
                  return(
                    <div key={v.id} onClick={()=>setVisitaViendo(v)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 12px",background:"white",border:"1px solid #eee",borderRadius:8,cursor:"pointer"}}>
                      <div>
                        <div style={{fontSize:12,fontWeight:700,color:"#333"}}>{v.tipoActividad} · {v.fecha}</div>
                        <div style={{fontSize:11,color:"#888"}}>{v.ciudad}{v.site?" · "+v.site:""}{v.responsable?" · "+v.responsable:""}</div>
                        {v.observaciones&&<div style={{fontSize:10,color:"#aaa",marginTop:2,fontStyle:"italic"}}>{v.observaciones.slice(0,60)}{v.observaciones.length>60?"...":""}</div>}
                      </div>
                      <span style={{background:est.bg,color:est.color,padding:"3px 10px",borderRadius:20,fontSize:10,fontWeight:700,flexShrink:0,marginLeft:8}}>{v.estado}</span>
                    </div>
                  );
                })}
                {visSel.length===0&&<p style={{fontSize:11,color:"#bbb",padding:"8px 0"}}>Este contacto aún no tiene visitas registradas. Usa el botón + Registrar visita.</p>}
              </div>
            </div>
          )}
          {directorio.length===0&&<p style={{fontSize:12,color:"#bbb"}}>Agrega contactos en el Directorio de Contactos para poder registrar visitas.</p>}
        </div>
      </div>
      );
    })()}
    </div>
  )}

  </div>
  {/* ══ MODAL EDICIÓN DE ALIADO ══ */}
  {modalAliado&&(
  <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
    <div style={{background:"white",borderRadius:12,padding:24,width:"100%",maxWidth:560,maxHeight:"90vh",overflowY:"auto",boxShadow:"0 8px 40px rgba(0,0,0,.2)"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
        <h3 style={{fontSize:15,fontWeight:700,color:"#333"}}>{aliadoEditando?"✏️ Editar Aliado":"➕ Nuevo Aliado"}</h3>
        <button onClick={cerrarModal} style={{border:"none",background:"#f5f5f5",borderRadius:6,padding:"4px 10px",cursor:"pointer",fontSize:14,color:"#666"}}>✕</button>
      </div>

      {/* Fila 1: Empresa y Estado */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
        <div>
          <label style={{fontSize:11,fontWeight:600,color:"#555",display:"block",marginBottom:4}}>Empresa *</label>
          <input value={aliadoForm.empresa||""} onChange={e=>setAliadoForm(p=>({...p,empresa:e.target.value}))} style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"7px 10px",fontSize:12}} placeholder="Nombre del aliado"/>
        </div>
        <div>
          <label style={{fontSize:11,fontWeight:600,color:"#555",display:"block",marginBottom:4}}>Estado</label>
          <select value={aliadoForm.estado||"Confirmado"} onChange={e=>setAliadoForm(p=>({...p,estado:e.target.value}))} style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"7px 10px",fontSize:12}}>
            {ESTADOS_ALIADO.map(e=><option key={e} value={e}>{e}</option>)}
          </select>
        </div>
      </div>

      {/* Fila 2: Contacto y Categoría */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
        <div>
          <label style={{fontSize:11,fontWeight:600,color:"#555",display:"block",marginBottom:4}}>Contacto</label>
          <input value={aliadoForm.contacto||""} onChange={e=>setAliadoForm(p=>({...p,contacto:e.target.value}))} style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"7px 10px",fontSize:12}} placeholder="Nombre del contacto"/>
        </div>
        <div>
          <label style={{fontSize:11,fontWeight:600,color:"#555",display:"block",marginBottom:4}}>Categoría</label>
          <input value={aliadoForm.categoria||""} onChange={e=>setAliadoForm(p=>({...p,categoria:e.target.value}))} style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"7px 10px",fontSize:12}} placeholder="Ej: Educación, Bienestar..."/>
        </div>
      </div>

      {/* Fila 3: Correo y Teléfono */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
        <div>
          <label style={{fontSize:11,fontWeight:600,color:"#555",display:"block",marginBottom:4}}>Correo</label>
          <input value={aliadoForm.correo||""} onChange={e=>setAliadoForm(p=>({...p,correo:e.target.value}))} style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"7px 10px",fontSize:12}} placeholder="correo@ejemplo.com"/>
        </div>
        <div>
          <label style={{fontSize:11,fontWeight:600,color:"#555",display:"block",marginBottom:4}}>Teléfono</label>
          <input value={aliadoForm.telefono||""} onChange={e=>setAliadoForm(p=>({...p,telefono:e.target.value}))} style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"7px 10px",fontSize:12}} placeholder="3001234567"/>
        </div>
      </div>

      {/* Fila 4: Ciudad y Responsable */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
        <div>
          <label style={{fontSize:11,fontWeight:600,color:"#555",display:"block",marginBottom:4}}>Ciudad</label>
          <input value={aliadoForm.ciudad||""} onChange={e=>setAliadoForm(p=>({...p,ciudad:e.target.value}))} style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"7px 10px",fontSize:12}} placeholder="Bogotá, Barranquilla..."/>
        </div>
        <div>
          <label style={{fontSize:11,fontWeight:600,color:"#555",display:"block",marginBottom:4}}>Responsable</label>
          <input value={aliadoForm.responsable||""} onChange={e=>setAliadoForm(p=>({...p,responsable:e.target.value}))} style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"7px 10px",fontSize:12}} placeholder="Quien gestiona el convenio"/>
        </div>
      </div>

      {/* Fila 5: Beneficio */}
      <div style={{marginBottom:10}}>
        <label style={{fontSize:11,fontWeight:600,color:"#555",display:"block",marginBottom:4}}>Beneficio</label>
        <input value={aliadoForm.beneficio||""} onChange={e=>setAliadoForm(p=>({...p,beneficio:e.target.value}))} style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"7px 10px",fontSize:12}} placeholder="Ej: 20% DTO en planes de membresía"/>
      </div>

      {/* Fila 6: Cómo aplica */}
      <div style={{marginBottom:10}}>
        <label style={{fontSize:11,fontWeight:600,color:"#555",display:"block",marginBottom:4}}>Cómo aplica</label>
        <input value={aliadoForm.comoAplica||""} onChange={e=>setAliadoForm(p=>({...p,comoAplica:e.target.value}))} style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"7px 10px",fontSize:12}} placeholder="Instrucciones para acceder al beneficio"/>
      </div>

      {/* Fila 7: Fecha inicio + Fecha último contacto */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
        <div>
          <label style={{fontSize:11,fontWeight:600,color:"#555",display:"block",marginBottom:4}}>Inicio convenio</label>
          <input type="date" value={aliadoForm.fechaInicioConvenio||""} onChange={e=>setAliadoForm(p=>({...p,fechaInicioConvenio:e.target.value}))} style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"7px 10px",fontSize:12}}/>
        </div>
        <div>
          <label style={{fontSize:11,fontWeight:600,color:"#555",display:"block",marginBottom:4}}>Último contacto</label>
          <input type="date" value={aliadoForm.fechaUltimoContacto||""} onChange={e=>setAliadoForm(p=>({...p,fechaUltimoContacto:e.target.value}))} style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"7px 10px",fontSize:12}}/>
        </div>
      </div>

      {/* Fila 8: Aplica familia + Estado negociación (si aplica) */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
        <div style={{display:"flex",alignItems:"center",gap:8,paddingTop:18}}>
          <input type="checkbox" id="chkFamilia" checked={!!aliadoForm.aplicaFamilia} onChange={e=>setAliadoForm(p=>({...p,aplicaFamilia:e.target.checked}))} style={{width:14,height:14}}/>
          <label htmlFor="chkFamilia" style={{fontSize:12,color:"#555",cursor:"pointer"}}>Aplica a familia</label>
        </div>
        {aliadoForm.estado==="En Gestión"&&(
          <div>
            <label style={{fontSize:11,fontWeight:600,color:"#555",display:"block",marginBottom:4}}>Estado negociación</label>
            <select value={aliadoForm.estadoNegociacion||"Pendiente"} onChange={e=>setAliadoForm(p=>({...p,estadoNegociacion:e.target.value}))} style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"7px 10px",fontSize:12}}>
              {ESTADOS_NEGOCIACION.map(e=><option key={e} value={e}>{e}</option>)}
            </select>
          </div>
        )}
      </div>

      {/* Comentarios */}
      <div style={{marginBottom:16}}>
        <label style={{fontSize:11,fontWeight:600,color:"#555",display:"block",marginBottom:4}}>Comentarios / Seguimiento</label>
        <textarea value={aliadoForm.comentarios||""} onChange={e=>setAliadoForm(p=>({...p,comentarios:e.target.value}))} rows={3} style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"7px 10px",fontSize:12,resize:"vertical"}} placeholder="Notas de seguimiento, observaciones..."/>
      </div>

      {/* Archivo de soporte */}
      <div style={{marginBottom:16,background:"#f8faff",borderRadius:10,padding:"14px 16px",border:"1px solid #d0e2ff"}}>
        <label style={{fontSize:11,fontWeight:700,color:"#1a3a6b",display:"block",marginBottom:10}}>📎 Archivo de soporte <span style={{fontWeight:400,color:"#aaa"}}>(convenio, propuesta, cotización u otro)</span></label>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
          <div>
            <label style={{fontSize:10,fontWeight:600,color:"#555",display:"block",marginBottom:4}}>Tipo de documento</label>
            <select value={(aliadoForm.archivoSoporte||{}).tipo||"Convenio"} onChange={e=>setAliadoForm(p=>({...p,archivoSoporte:{...(p.archivoSoporte||{}),tipo:e.target.value}}))}
              style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"7px 10px",fontSize:12,background:"white"}}>
              {["Convenio firmado","Propuesta comercial","Cotización","Carta de intención","Otro"].map(t=><option key={t} value={t}>{t}</option>)}
            </select>
          </div>
          <div>
            <label style={{fontSize:10,fontWeight:600,color:"#555",display:"block",marginBottom:4}}>Nombre del archivo</label>
            <input value={(aliadoForm.archivoSoporte||{}).nombre||""} onChange={e=>setAliadoForm(p=>({...p,archivoSoporte:{...(p.archivoSoporte||{}),nombre:e.target.value}}))}
              style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"7px 10px",fontSize:12}} placeholder="Ej: Convenio_SLANG_2026.pdf"/>
          </div>
        </div>
        <div>
          <label style={{fontSize:10,fontWeight:600,color:"#555",display:"block",marginBottom:4}}>Enlace al archivo (OneDrive, SharePoint, Google Drive…)</label>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            <input value={(aliadoForm.archivoSoporte||{}).url||""} onChange={e=>setAliadoForm(p=>({...p,archivoSoporte:{...(p.archivoSoporte||{}),url:e.target.value}}))}
              style={{flex:1,border:"1px solid #ddd",borderRadius:6,padding:"7px 10px",fontSize:12}} placeholder="https://..."/>
            {(aliadoForm.archivoSoporte||{}).url&&(
              <>
                <a href={(aliadoForm.archivoSoporte||{}).url} target="_blank" rel="noopener noreferrer"
                  style={{padding:"7px 12px",borderRadius:6,background:AZUL,color:"white",fontSize:11,fontWeight:700,textDecoration:"none",whiteSpace:"nowrap"}}>
                  🔗 Abrir
                </a>
                <button onClick={()=>setAliadoForm(p=>({...p,archivoSoporte:{...(p.archivoSoporte||{}),url:"",nombre:""}}))}
                  style={{padding:"7px 10px",borderRadius:6,border:"1px solid #fee2e2",background:"#fff1f2",color:"#dc2626",fontSize:11,cursor:"pointer"}}>✕</button>
              </>
            )}
          </div>
          {(aliadoForm.archivoSoporte||{}).url&&(
            <div style={{marginTop:6,fontSize:10,color:VERDE,fontWeight:600}}>
              ✓ Soporte vinculado: {(aliadoForm.archivoSoporte||{}).tipo||"Documento"}{(aliadoForm.archivoSoporte||{}).nombre?" · "+(aliadoForm.archivoSoporte||{}).nombre:""}
            </div>
          )}
          {!(aliadoForm.archivoSoporte||{}).url&&(
            <div style={{marginTop:6,fontSize:10,color:"#bbb"}}>Pega el enlace compartido desde OneDrive, SharePoint o Google Drive.</div>
          )}
        </div>
      </div>

      {/* Historial de estados (solo lectura) */}
      {(aliadoForm.historialEstados||[]).length>0&&(
        <div style={{marginBottom:16,background:"#f9fafb",borderRadius:6,padding:10}}>
          <div style={{fontSize:11,fontWeight:700,color:"#555",marginBottom:6}}>📋 Historial de estados</div>
          {(aliadoForm.historialEstados||[]).map((h,i)=>(
            <div key={i} style={{fontSize:11,color:"#666",marginBottom:3}}>
              <span style={{fontWeight:600,color:"#333"}}>{h.estado}</span> · {h.fecha}{h.responsable?` · ${h.responsable}`:""}
            </div>
          ))}
        </div>
      )}

      {/* Botones */}
      <div style={{display:"flex",justifyContent:"flex-end",gap:8}}>
        <button onClick={cerrarModal} style={{padding:"8px 16px",borderRadius:6,border:"1px solid #ddd",background:"white",fontSize:12,cursor:"pointer",color:"#666"}}>Cancelar</button>
        <button onClick={guardarAliado} disabled={!aliadoForm.empresa||!aliadoForm.empresa.trim()} style={{padding:"8px 20px",borderRadius:6,border:"none",background:AZUL,color:"white",fontSize:12,fontWeight:700,cursor:"pointer",opacity:(!aliadoForm.empresa||!aliadoForm.empresa.trim())?.5:1}}>
          {aliadoEditando?"Guardar cambios":"Crear aliado"}
        </button>
      </div>
    </div>
  </div>
  )}

  {/* ══ MODAL CONFIRMACIÓN ELIMINAR ══ */}
  {modalEliminar&&(
  <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",zIndex:1001,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
    <div style={{background:"white",borderRadius:12,padding:24,width:"100%",maxWidth:360,textAlign:"center",boxShadow:"0 8px 40px rgba(0,0,0,.2)"}}>
      <div style={{fontSize:32,marginBottom:12}}>⚠️</div>
      <h3 style={{fontSize:14,fontWeight:700,color:"#333",marginBottom:8}}>¿Eliminar este aliado?</h3>
      <p style={{fontSize:12,color:"#666",marginBottom:20}}>Esta acción no se puede deshacer. Se eliminará el registro y toda su información.</p>
      <div style={{display:"flex",gap:8,justifyContent:"center"}}>
        <button onClick={()=>setModalEliminar(null)} style={{padding:"8px 20px",borderRadius:6,border:"1px solid #ddd",background:"white",fontSize:12,cursor:"pointer",color:"#666"}}>Cancelar</button>
        <button onClick={()=>eliminarAliado(modalEliminar)} style={{padding:"8px 20px",borderRadius:6,border:"none",background:"#dc2626",color:"white",fontSize:12,fontWeight:700,cursor:"pointer"}}>Eliminar</button>
      </div>
    </div>
  </div>
  )}

  {/* ══════ TAB CONVENIOS HISTÓRICOS ══════ */}
  {tab==="historicos"&&(()=>{
    const listaHist=directorio.filter(a=>a.grupo==="historico");
    const listaFiltrada=listaHist.filter(a=>{
      if(!histFiltro.trim()) return true;
      const q=histFiltro.toLowerCase();
      return(a.empresa||"").toLowerCase().includes(q)||(a.contacto||"").toLowerCase().includes(q)||(a.categoria||"").toLowerCase().includes(q)||(a.ciudad||"").toLowerCase().includes(q);
    });

    // Visitas de históricos
    const visitasHist=visitas.filter(v=>{
      const d=directorio.find(x=>x.id===v.aliadoId);
      return d&&d.grupo==="historico";
    });
    const hoyStr=new Date().toISOString().slice(0,10);
    const proximasHist=visitasHist.filter(v=>v.estado==="Programada"&&v.fecha>=hoyStr).sort((a,b)=>a.fecha.localeCompare(b.fecha)).slice(0,5);
    const aliadoHistSel=histAliadoSel?listaHist.find(d=>d.id===histAliadoSel):null;
    const visitasDelHist=aliadoHistSel?visitasDe(aliadoHistSel.id):[];

    const COLS_EST={
      "Finalizada":{bg:"#dcfce7",color:"#166534"},
      "Programada":{bg:"#dbeafe",color:"#1e40af"},
      "En curso":{bg:"#fef3c7",color:"#92400e"},
      "Cancelada":{bg:"#fee2e2",color:"#991b1b"},
    };

    return(
    <div>
      {/* Encabezado */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:8}}>
        <div>
          <h2 style={{fontSize:16,fontWeight:800,color:"#495057",marginBottom:3}}>🏛️ Convenios Históricos · Sutherland TR</h2>
          <p style={{fontSize:11,color:"#888"}}>{listaHist.length} convenios vigentes implementados por Sutherland · Gestión de mantenimiento y relación</p>
        </div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>setHistVista("directorio")} style={{padding:"8px 16px",borderRadius:20,border:"1.5px solid "+(histVista==="directorio"?"#495057":"#ddd"),background:histVista==="directorio"?"#495057":"white",color:histVista==="directorio"?"white":"#666",fontSize:12,fontWeight:600,cursor:"pointer"}}>📋 Directorio</button>
          <button onClick={()=>setHistVista("visitas")} style={{padding:"8px 16px",borderRadius:20,border:"1.5px solid "+(histVista==="visitas"?PURP:"#ddd"),background:histVista==="visitas"?PURP:"white",color:histVista==="visitas"?"white":"#666",fontSize:12,fontWeight:600,cursor:"pointer"}}>📊 Visitas</button>
        </div>
      </div>

      {/* KPIs rápidos */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:20}}>
        {[
          {label:"Convenios únicos",val:new Set(listaHist.map(a=>a.convenio_padre||a.id)).size,color:"#495057",bg:"#f8f9fa",icon:"🏛️"},
          {label:"Registros de contacto",val:listaHist.length,color:"#6c757d",bg:"#f8f9fa",icon:"📋"},
          {label:"Visitas registradas",val:visitasHist.length,color:PURP,bg:"#faf7ff",icon:"📍"},
          {label:"Próximas programadas",val:proximasHist.length,color:AZUL,bg:"#e8f1fb",icon:"📅"},
          {label:"Ciudades con presencia",val:new Set(listaHist.map(a=>a.ciudad).filter(Boolean)).size,color:VERDE,bg:"#f0f7eb",icon:"📍"},
        ].map((k,i)=>(
          <div key={i} style={{background:k.bg,border:"1px solid #e5e7eb",borderRadius:10,padding:"12px 14px"}}>
            <div style={{fontSize:20}}>{k.icon}</div>
            <div style={{fontSize:22,fontWeight:900,color:k.color,lineHeight:1,marginTop:4}}>{k.val}</div>
            <div style={{fontSize:10,color:"#888",marginTop:4,fontWeight:600}}>{k.label}</div>
          </div>
        ))}
      </div>

      {/* ── VISTA DIRECTORIO ── */}
      {histVista==="directorio"&&(
        <div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,gap:8,flexWrap:"wrap"}}>
            <input value={histFiltro} onChange={e=>setHistFiltro(e.target.value)} placeholder="Buscar por empresa, contacto, categoría o ciudad..." style={{flex:1,maxWidth:380,padding:"8px 12px",border:"1px solid #ddd",borderRadius:7,fontSize:12}}/>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <span style={{fontSize:11,color:"#aaa"}}>{listaFiltrada.length} de {listaHist.length} registros</span>
              <button onClick={()=>abrirModalNuevo("Confirmado","historico")} style={{padding:"8px 14px",borderRadius:6,border:"none",background:"#495057",color:"white",fontSize:12,fontWeight:700,cursor:"pointer"}}>+ Agregar convenio</button>
            </div>
          </div>
          <div style={{overflowX:"auto",border:"1.5px solid #dee2e6",borderRadius:8}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
              <thead>
                <tr style={{background:"#495057"}}>
                  {["Empresa","Contacto","Categoría","Ciudad","Correo","Teléfono","Acciones"].map(h=>(
                    <th key={h} style={{textAlign:"left",padding:"10px 12px",fontWeight:700,color:"white"}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {listaFiltrada.length===0&&(
                  <tr><td colSpan={7} style={{padding:20,textAlign:"center",color:"#aaa",fontSize:12}}>No se encontraron convenios con ese criterio.</td></tr>
                )}
                {listaFiltrada.map((a,i)=>(
                  <tr key={a.id} style={{borderBottom:"1px solid #dee2e6",background:i%2===0?"white":"#f8f9fa"}}>
                    <td style={{padding:"9px 12px",fontWeight:600,color:"#333"}}>{a.empresa}{a.convenio_padre&&<span style={{marginLeft:6,fontSize:9,background:"#e8f1fb",color:AZUL,padding:"1px 6px",borderRadius:10,fontWeight:700}}>multi-sede</span>}</td>
                    <td style={{padding:"9px 12px",color:"#666"}}>{a.contacto||"—"}</td>
                    <td style={{padding:"9px 12px",color:"#666"}}>{a.categoria||"—"}</td>
                    <td style={{padding:"9px 12px",color:"#666"}}>{a.ciudad||"—"}</td>
                    <td style={{padding:"9px 12px",color:"#555",maxWidth:140,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.correo||"—"}</td>
                    <td style={{padding:"9px 12px",color:"#555"}}>{a.telefono||"—"}</td>
                    <td style={{padding:"9px 12px",textAlign:"center",whiteSpace:"nowrap"}}>
                      <button onClick={()=>abrirModalEditar(a)} style={{border:"none",background:"#e8f1fb",color:AZUL,borderRadius:4,padding:"4px 8px",fontSize:11,cursor:"pointer",marginRight:4,fontWeight:600}}>✏️</button>
                      <button onClick={()=>setModalEliminar(a.id)} style={{border:"none",background:"#fee2e2",color:"#dc2626",borderRadius:4,padding:"4px 8px",fontSize:11,cursor:"pointer",fontWeight:600}}>🗑️</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* ── VISTA VISITAS ── */}
      {histVista==="visitas"&&(
        <div>
          <div style={{fontSize:13,fontWeight:700,color:"#333",marginBottom:4}}>Registro de visitas de mantenimiento</div>
          <p style={{fontSize:11,color:"#888",marginBottom:16}}>Visitas realizadas a los convenios históricos para mantenimiento de la relación.</p>

          {/* Próximas visitas */}
          {proximasHist.length>0&&(
            <div style={{marginBottom:16}}>
              <div style={{fontSize:12,fontWeight:700,color:"#333",marginBottom:8}}>📅 Próximas visitas programadas</div>
              <div style={{display:"grid",gap:6}}>
                {proximasHist.map(v=>{
                  const d=listaHist.find(x=>x.id===v.aliadoId);
                  return(
                    <div key={v.id} onClick={()=>setVisitaViendo(v)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",background:"white",border:"1px solid #eee",borderRadius:8,cursor:"pointer"}}>
                      <div>
                        <div style={{fontSize:12,fontWeight:700,color:"#333"}}>{d?d.empresa:"?"} · {v.tipoActividad}</div>
                        <div style={{fontSize:10,color:"#999"}}>{v.ciudad}{v.responsable?" · "+v.responsable:""}</div>
                      </div>
                      <span style={{fontSize:11,fontWeight:600,color:AZUL}}>{v.fecha}</span>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* Selector de convenio histórico */}
          <div style={{fontSize:12,fontWeight:700,color:"#333",marginBottom:8}}>Historial por convenio</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:14}}>
            {listaHist.map(d=>(
              <button key={d.id} onClick={()=>setHistAliadoSel(d.id)}
                style={{padding:"5px 12px",borderRadius:20,border:"1.5px solid "+(histAliadoSel===d.id?"#495057":"#ddd"),background:histAliadoSel===d.id?"#495057":"white",color:histAliadoSel===d.id?"white":"#666",fontSize:11,fontWeight:600,cursor:"pointer"}}>
                {d.empresa}
                {visitasDe(d.id).length>0&&<span style={{marginLeft:5,background:"rgba(255,255,255,.25)",padding:"1px 6px",borderRadius:10,fontSize:9}}>{visitasDe(d.id).length}</span>}
              </button>
            ))}
          </div>

          {aliadoHistSel&&(
            <div>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                <span style={{fontSize:13,fontWeight:700,color:"#333"}}>{aliadoHistSel.empresa}</span>
                <button onClick={()=>abrirNuevaVisita(aliadoHistSel.id)} style={{background:"#495057",color:"white",border:"none",padding:"8px 14px",borderRadius:7,fontSize:12,fontWeight:600,cursor:"pointer"}}>+ Registrar visita</button>
              </div>
              <div style={{display:"flex",gap:8,marginBottom:12}}>
                <div style={{background:"#f8f9fa",borderRadius:8,padding:"8px 14px",textAlign:"center",minWidth:80}}>
                  <div style={{fontSize:18,fontWeight:900,color:"#495057"}}>{visitasDelHist.length}</div>
                  <div style={{fontSize:9,color:"#999"}}>Total visitas</div>
                </div>
                <div style={{background:"#f0f7eb",borderRadius:8,padding:"8px 14px",textAlign:"center",minWidth:80}}>
                  <div style={{fontSize:18,fontWeight:900,color:VERDE}}>{visitasDelHist.filter(v=>v.estado==="Finalizada").length}</div>
                  <div style={{fontSize:9,color:"#999"}}>Finalizadas</div>
                </div>
                <div style={{background:"#e8f1fb",borderRadius:8,padding:"8px 14px",textAlign:"center",minWidth:80}}>
                  <div style={{fontSize:18,fontWeight:900,color:AZUL}}>{visitasDelHist.filter(v=>v.estado==="Programada").length}</div>
                  <div style={{fontSize:9,color:"#999"}}>Programadas</div>
                </div>
              </div>
              <div style={{display:"grid",gap:6}}>
                {visitasDelHist.map(v=>{
                  const est=COLS_EST[v.estado]||{bg:"#f0f0f0",color:"#555"};
                  return(
                    <div key={v.id} onClick={()=>setVisitaViendo(v)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 12px",background:"white",border:"1px solid #eee",borderRadius:8,cursor:"pointer"}}>
                      <div>
                        <div style={{fontSize:12,fontWeight:700,color:"#333"}}>{v.tipoActividad} · {v.fecha}</div>
                        <div style={{fontSize:11,color:"#888"}}>{v.ciudad}{v.site?" · "+v.site:""}{v.responsable?" · "+v.responsable:""}</div>
                        {v.observaciones&&<div style={{fontSize:10,color:"#aaa",marginTop:2,fontStyle:"italic"}}>{v.observaciones.slice(0,60)}{v.observaciones.length>60?"...":""}</div>}
                      </div>
                      <span style={{background:est.bg,color:est.color,padding:"3px 10px",borderRadius:20,fontSize:10,fontWeight:700,flexShrink:0,marginLeft:8}}>{v.estado}</span>
                    </div>
                  );
                })}
                {visitasDelHist.length===0&&<p style={{fontSize:11,color:"#bbb",padding:"8px 0"}}>Este convenio aún no tiene visitas registradas.</p>}
              </div>
            </div>
          )}
          {!aliadoHistSel&&<p style={{fontSize:11,color:"#bbb"}}>Selecciona un convenio histórico para ver su historial de visitas.</p>}
        </div>
      )}
    </div>
    );
  })()}

  {/* ══════ TAB TAREAS ══════ */}
  {tab==="tareas"&&(()=>{
    const PRIOR_COLOR={"Alta":{bg:"#fee2e2",color:"#dc2626"},"Media":{bg:"#fef3c7",color:"#b45309"},"Baja":{bg:"#f0f7eb",color:"#3B6D11"}};
    const hoyD=new Date().toISOString().slice(0,10);

    // Filtrado
    const tareasFiltradas=tareas.filter(t=>{
      if(tareasFiltro==="hoy") return t.fecha===hoyD&&!t.completada;
      if(tareasFiltro==="vencidas") return t.fecha<hoyD&&!t.completada;
      if(tareasFiltro==="completadas") return t.completada;
      if(tareasFiltro==="pendientes") return !t.completada;
      return true; // todas
    });

    // Ordenado
    const tareasOrdenadas=[...tareasFiltradas].sort((a,b)=>{
      if(tareasOrden==="prioridad"){
        const p={"Alta":0,"Media":1,"Baja":2};
        return(p[a.prioridad]||1)-(p[b.prioridad]||1)||a.fecha.localeCompare(b.fecha);
      }
      return a.fecha.localeCompare(b.fecha)||(a.hora||"").localeCompare(b.hora||"");
    });

    // Contadores
    const totalPendientes=tareas.filter(t=>!t.completada).length;
    const totalVencidas=tareas.filter(t=>!t.completada&&t.fecha<hoyD).length;
    const totalHoy=tareas.filter(t=>!t.completada&&t.fecha===hoyD).length;
    const totalCompletadas=tareas.filter(t=>t.completada).length;

    const irAAliado=(aliadoId)=>{
      const al=directorio.find(a=>a.id===aliadoId);
      if(!al) return;
      if(al.grupo==="historico"){setTab("historicos");setHistVista("directorio");}
      else{setTab("programa");setDirVista(al.estado==="Confirmado"?"confirmados":al.estado==="En Gestión"?"gestion":al.estado==="En Revisión"?"revision":al.estado==="En Formalización"?"formalizacion":"contactos");}
    };

    return(
    <div>
      {/* Encabezado */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18,flexWrap:"wrap",gap:10}}>
        <div>
          <h2 style={{fontSize:16,fontWeight:800,color:"#333",marginBottom:3}}>✅ Centro de Tareas</h2>
          <p style={{fontSize:11,color:"#888"}}>Gestión de pendientes del Programa de Aliados</p>
        </div>
        <button onClick={()=>abrirNuevaTarea("")} style={{background:AZUL,color:"white",border:"none",padding:"9px 18px",borderRadius:8,fontSize:13,fontWeight:700,cursor:"pointer"}}>+ Nueva tarea</button>
      </div>

      {/* KPIs */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:18}}>
        {[
          {label:"Pendientes",val:totalPendientes,color:"#333",bg:"#f9fafb",icon:"📋",filtro:"pendientes"},
          {label:"Vencidas",val:totalVencidas,color:"#dc2626",bg:"#fff1f2",icon:"🔴",filtro:"vencidas"},
          {label:"Para hoy",val:totalHoy,color:"#b45309",bg:"#fef3c7",icon:"🟡",filtro:"hoy"},
          {label:"Completadas",val:totalCompletadas,color:VERDE,bg:"#f0f7eb",icon:"🟢",filtro:"completadas"},
        ].map(k=>(
          <div key={k.label} onClick={()=>setTareasFiltro(k.filtro)}
            style={{background:tareasFiltro===k.filtro?k.bg:"white",border:"2px solid "+(tareasFiltro===k.filtro?k.color:"#e5e7eb"),borderRadius:10,padding:"12px 14px",cursor:"pointer",transition:"all .15s"}}>
            <div style={{fontSize:18}}>{k.icon}</div>
            <div style={{fontSize:24,fontWeight:900,color:k.color,lineHeight:1,marginTop:4}}>{k.val}</div>
            <div style={{fontSize:10,color:"#888",marginTop:3,fontWeight:600}}>{k.label}</div>
          </div>
        ))}
      </div>

      {/* Controles de orden y filtro */}
      <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap",alignItems:"center"}}>
        <span style={{fontSize:11,color:"#999",fontWeight:600}}>Filtro:</span>
        {[["pendientes","⏳ Pendientes"],["hoy","🟡 Hoy"],["vencidas","🔴 Vencidas"],["completadas","🟢 Completadas"],["todas","📋 Todas"]].map(([v,l])=>(
          <button key={v} onClick={()=>setTareasFiltro(v)}
            style={{padding:"5px 12px",borderRadius:20,border:"1.5px solid "+(tareasFiltro===v?AZUL:"#ddd"),background:tareasFiltro===v?AZUL:"white",color:tareasFiltro===v?"white":"#666",fontSize:11,fontWeight:600,cursor:"pointer"}}>
            {l}
          </button>
        ))}
        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:6}}>
          <span style={{fontSize:11,color:"#999",fontWeight:600}}>Ordenar:</span>
          <button onClick={()=>setTareasOrden("fecha")}
            style={{padding:"5px 12px",borderRadius:20,border:"1.5px solid "+(tareasOrden==="fecha"?PURP:"#ddd"),background:tareasOrden==="fecha"?PURP:"white",color:tareasOrden==="fecha"?"white":"#666",fontSize:11,fontWeight:600,cursor:"pointer"}}>
            📅 Por fecha
          </button>
          <button onClick={()=>setTareasOrden("prioridad")}
            style={{padding:"5px 12px",borderRadius:20,border:"1.5px solid "+(tareasOrden==="prioridad"?PURP:"#ddd"),background:tareasOrden==="prioridad"?PURP:"white",color:tareasOrden==="prioridad"?"white":"#666",fontSize:11,fontWeight:600,cursor:"pointer"}}>
            🔺 Por prioridad
          </button>
        </div>
      </div>

      {/* Lista de tareas */}
      {tareasOrdenadas.length===0?(
        <div style={{textAlign:"center",padding:"48px 20px",color:"#bbb"}}>
          <div style={{fontSize:40,marginBottom:12}}>✅</div>
          <div style={{fontSize:14,fontWeight:600,marginBottom:6}}>
            {tareasFiltro==="completadas"?"No hay tareas completadas aún":"¡Sin tareas pendientes!"}
          </div>
          <div style={{fontSize:12}}>Crea una nueva tarea con el botón de arriba.</div>
        </div>
      ):(
        <div style={{display:"grid",gap:8}}>
          {tareasOrdenadas.map(t=>{
            const sem=semaforo(t);
            const al=t.aliadoId?directorio.find(a=>a.id===t.aliadoId):null;
            const pc=PRIOR_COLOR[t.prioridad]||PRIOR_COLOR["Media"];
            return(
              <div key={t.id} style={{background:"white",border:"1px solid #e5e7eb",borderRadius:10,padding:"12px 16px",display:"flex",gap:12,alignItems:"flex-start",opacity:t.completada?.6:1,boxShadow:"0 1px 3px rgba(0,0,0,.04)"}}>
                {/* Checkbox */}
                <div onClick={()=>toggleTarea(t.id)} style={{width:20,height:20,borderRadius:5,border:"2px solid "+(t.completada?VERDE:"#ddd"),background:t.completada?VERDE:"white",cursor:"pointer",flexShrink:0,marginTop:2,display:"flex",alignItems:"center",justifyContent:"center"}}>
                  {t.completada&&<span style={{color:"white",fontSize:12,fontWeight:800}}>✓</span>}
                </div>
                {/* Contenido */}
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:4}}>
                    <span style={{fontSize:13,fontWeight:700,color:t.completada?"#aaa":"#333",textDecoration:t.completada?"line-through":"none"}}>{t.titulo}</span>
                    <span style={{fontSize:9,fontWeight:700,background:pc.bg,color:pc.color,padding:"2px 8px",borderRadius:20}}>{t.prioridad}</span>
                    <span style={{fontSize:10,fontWeight:600,color:sem.color}}>{sem.emoji} {sem.label}</span>
                  </div>
                  <div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"center"}}>
                    <span style={{fontSize:11,color:"#888"}}>📅 {t.fecha}{t.hora?" · ⏰ "+t.hora:""}</span>
                    {al&&(
                      <span onClick={()=>irAAliado(t.aliadoId)} style={{fontSize:11,color:AZUL,fontWeight:600,cursor:"pointer",textDecoration:"underline"}}>
                        🤝 {al.empresa}
                      </span>
                    )}
                  </div>
                  {t.notas&&<div style={{fontSize:11,color:"#999",marginTop:4,fontStyle:"italic"}}>{t.notas}</div>}
                </div>
                {/* Acciones */}
                <div style={{display:"flex",gap:4,flexShrink:0}}>
                  {!t.completada&&t.fecha<hoyStr&&(
                    <button onClick={()=>reprogramarTarea(t)} title="Reprogramar" style={{border:"none",background:"#fef3c7",color:"#b45309",borderRadius:6,padding:"5px 8px",fontSize:11,cursor:"pointer",fontWeight:600}}>📅</button>
                  )}
                  <button onClick={()=>abrirEditarTarea(t)} style={{border:"none",background:"#e8f1fb",color:AZUL,borderRadius:6,padding:"5px 8px",fontSize:11,cursor:"pointer",fontWeight:600}}>✏️</button>
                  <button onClick={()=>eliminarTarea(t.id)} style={{border:"none",background:"#fee2e2",color:"#dc2626",borderRadius:6,padding:"5px 8px",fontSize:11,cursor:"pointer",fontWeight:600}}>🗑️</button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* Modal crear/editar tarea */}
      {modalTarea&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
          <div style={{background:"white",borderRadius:12,padding:24,width:"100%",maxWidth:480,maxHeight:"90vh",overflowY:"auto",boxShadow:"0 8px 40px rgba(0,0,0,.2)"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
              <h3 style={{fontSize:15,fontWeight:700,color:"#333"}}>{tareaEditando?"✏️ Editar tarea":"➕ Nueva tarea"}</h3>
              <button onClick={()=>setModalTarea(false)} style={{border:"none",background:"#f5f5f5",borderRadius:6,padding:"4px 10px",cursor:"pointer",fontSize:14,color:"#666"}}>✕</button>
            </div>
            <div style={{marginBottom:12}}>
              <label style={{fontSize:11,fontWeight:700,color:"#555",display:"block",marginBottom:4}}>Título *</label>
              <input value={tareaForm.titulo||""} onChange={e=>setTareaForm(p=>({...p,titulo:e.target.value}))}
                style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"8px 11px",fontSize:13}} placeholder="¿Qué tienes que hacer?"/>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
              <div>
                <label style={{fontSize:11,fontWeight:700,color:"#555",display:"block",marginBottom:4}}>Fecha *</label>
                <input type="date" value={tareaForm.fecha||""} onChange={e=>setTareaForm(p=>({...p,fecha:e.target.value}))}
                  style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"8px 11px",fontSize:12}}/>
              </div>
              <div>
                <label style={{fontSize:11,fontWeight:700,color:"#555",display:"block",marginBottom:4}}>Hora (opcional)</label>
                <input type="time" value={tareaForm.hora||""} onChange={e=>setTareaForm(p=>({...p,hora:e.target.value}))}
                  style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"8px 11px",fontSize:12}}/>
              </div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
              <div>
                <label style={{fontSize:11,fontWeight:700,color:"#555",display:"block",marginBottom:4}}>Prioridad</label>
                <select value={tareaForm.prioridad||"Media"} onChange={e=>setTareaForm(p=>({...p,prioridad:e.target.value}))}
                  style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"8px 11px",fontSize:12,background:"white"}}>
                  {PRIORIDADES.map(p=><option key={p} value={p}>{p}</option>)}
                </select>
              </div>
              <div>
                <label style={{fontSize:11,fontWeight:700,color:"#555",display:"block",marginBottom:4}}>Aliado relacionado</label>
                <select value={tareaForm.aliadoId||""} onChange={e=>setTareaForm(p=>({...p,aliadoId:e.target.value}))}
                  style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"8px 11px",fontSize:12,background:"white"}}>
                  <option value="">Sin aliado</option>
                  <optgroup label="── Programa de Aliados ──">
                    {directorio.filter(a=>a.grupo==="programa"||!a.grupo).sort((a,b)=>a.empresa.localeCompare(b.empresa)).map(a=>(
                      <option key={a.id} value={a.id}>{a.empresa}</option>
                    ))}
                  </optgroup>
                  <optgroup label="── Históricos ──">
                    {directorio.filter(a=>a.grupo==="historico").sort((a,b)=>a.empresa.localeCompare(b.empresa)).map(a=>(
                      <option key={a.id} value={a.id}>{a.empresa} ({a.ciudad})</option>
                    ))}
                  </optgroup>
                </select>
              </div>
            </div>
            <div style={{marginBottom:18}}>
              <label style={{fontSize:11,fontWeight:700,color:"#555",display:"block",marginBottom:4}}>Notas</label>
              <textarea value={tareaForm.notas||""} onChange={e=>setTareaForm(p=>({...p,notas:e.target.value}))}
                rows={3} style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"8px 11px",fontSize:12,resize:"vertical"}}
                placeholder="Detalles adicionales..."/>
            </div>
            <div style={{display:"flex",justifyContent:"flex-end",gap:8}}>
              <button onClick={()=>setModalTarea(false)} style={{padding:"8px 16px",borderRadius:6,border:"1px solid #ddd",background:"white",fontSize:12,cursor:"pointer",color:"#666"}}>Cancelar</button>
              <button onClick={guardarTarea} disabled={!tareaForm.titulo||!tareaForm.titulo.trim()}
                style={{padding:"8px 20px",borderRadius:6,border:"none",background:AZUL,color:"white",fontSize:12,fontWeight:700,cursor:"pointer",opacity:(!tareaForm.titulo||!tareaForm.titulo.trim())?.5:1}}>
                {tareaEditando?"Guardar cambios":"Crear tarea"}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
    );
  })()}

  {/* ══════ TAB GALERÍA ══════ */}
  {tab==="galeria"&&(()=>{
    const TIPOS_ACT_GAL=["Stand","Activación","Charla","Entrega de material","Evento general","Otro"];
    const MESES_GAL=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

    // Filtros aplicados
    const galeriaFiltrada=galeria.filter(f=>{
      if(galeriaFiltroAliado&&f.aliadoId!==galeriaFiltroAliado)return false;
      if(galeriaFiltroMes&&(!f.fecha||new Date(f.fecha).getMonth()!==parseInt(galeriaFiltroMes)))return false;
      if(galeriaFiltroTipo&&f.tipoActividad!==galeriaFiltroTipo)return false;
      return true;
    });

    // Índice de foto activa en lightbox (sobre galeriaFiltrada)
    const idxActivo=galeriaLightbox!==null?galeriaFiltrada.findIndex(f=>f.id===galeriaLightbox):-1;

    // Helpers
    const nombreAliado=(id)=>{
      if(!id)return"General";
      const a=directorio.find(x=>x.id===id);
      return a?a.empresa:"General";
    };

    const comprimirImagen=(file,cb)=>{
      const canvas=document.createElement("canvas");
      const img=new Image();
      img.onload=()=>{
        const MAX=800;
        const ratio=Math.min(MAX/img.width,MAX/img.height,1);
        canvas.width=img.width*ratio;
        canvas.height=img.height*ratio;
        canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
        cb(canvas.toDataURL("image/jpeg",0.75));
      };
      img.src=URL.createObjectURL(file);
    };

    const abrirFormNuevo=()=>{
      setGaleriaForm({titulo:"",descripcion:"",aliadoId:"",fecha:new Date().toISOString().slice(0,10),tipoActividad:"Stand",dataUrl:""});
      setGaleriaModal(true);
    };

    const guardarFoto=()=>{
      if(!galeriaForm.dataUrl||!galeriaForm.titulo.trim())return;
      const nueva={...galeriaForm,id:"foto_"+Date.now()};
      setGaleria(p=>[nueva,...p]);
      setGaleriaModal(false);
    };

    const eliminarFoto=(id)=>{
      if(!window.confirm("¿Eliminar esta fotografía?"))return;
      setGaleria(p=>p.filter(f=>f.id!==id));
      if(galeriaLightbox===id)setGaleriaLightbox(null);
    };

    const navLightbox=(dir)=>{
      if(galeriaFiltrada.length===0)return;
      const nuevo=(idxActivo+dir+galeriaFiltrada.length)%galeriaFiltrada.length;
      setGaleriaLightbox(galeriaFiltrada[nuevo].id);
    };

    const fotoActiva=idxActivo>=0?galeriaFiltrada[idxActivo]:null;

    return(
    <div>
      {/* Encabezado */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:8}}>
        <div>
          <h2 style={{fontSize:16,fontWeight:700,color:"#333",marginBottom:2}}>🖼️ Galería de Actividades</h2>
          <p style={{fontSize:11,color:"#888"}}>{galeria.length} foto{galeria.length!==1?"s":""} registrada{galeria.length!==1?"s":""}{galeriaFiltrada.length!==galeria.length?" · "+galeriaFiltrada.length+" visible"+(galeriaFiltrada.length!==1?"s":"")+" con filtros":""}</p>
        </div>
        <button onClick={abrirFormNuevo} style={{padding:"8px 16px",borderRadius:6,border:"none",background:AZUL,color:"white",fontSize:12,fontWeight:700,cursor:"pointer"}}>+ Agregar foto</button>
      </div>

      {/* Filtros */}
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:16,padding:"12px 14px",background:"#f9fafb",borderRadius:8,border:"1px solid #e5e7eb"}}>
        <select value={galeriaFiltroAliado} onChange={e=>setGaleriaFiltroAliado(e.target.value)} style={{fontSize:11,padding:"5px 10px",borderRadius:6,border:"1px solid #ddd",background:"white",color:"#555"}}>
          <option value="">Todos los aliados</option>
          <option value="">— General —</option>
          {directorio.filter(a=>a.estado==="Confirmado"||a.estado==="En Gestión").sort((a,b)=>a.empresa.localeCompare(b.empresa)).map(a=>(
            <option key={a.id} value={a.id}>{a.empresa}</option>
          ))}
        </select>
        <select value={galeriaFiltroMes} onChange={e=>setGaleriaFiltroMes(e.target.value)} style={{fontSize:11,padding:"5px 10px",borderRadius:6,border:"1px solid #ddd",background:"white",color:"#555"}}>
          <option value="">Todos los meses</option>
          {MESES_GAL.map((m,i)=><option key={i} value={i}>{m}</option>)}
        </select>
        <select value={galeriaFiltroTipo} onChange={e=>setGaleriaFiltroTipo(e.target.value)} style={{fontSize:11,padding:"5px 10px",borderRadius:6,border:"1px solid #ddd",background:"white",color:"#555"}}>
          <option value="">Todos los tipos</option>
          {TIPOS_ACT_GAL.map(t=><option key={t} value={t}>{t}</option>)}
        </select>
        {(galeriaFiltroAliado||galeriaFiltroMes||galeriaFiltroTipo)&&(
          <button onClick={()=>{setGaleriaFiltroAliado("");setGaleriaFiltroMes("");setGaleriaFiltroTipo("");}} style={{fontSize:11,padding:"5px 10px",borderRadius:6,border:"1px solid #ddd",background:"white",color:"#888",cursor:"pointer"}}>✕ Limpiar filtros</button>
        )}
      </div>

      {/* Grid de miniaturas */}
      {galeriaFiltrada.length>0?(
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:12}}>
          {galeriaFiltrada.map((f,i)=>(
            <div key={f.id} style={{borderRadius:10,overflow:"hidden",border:"1px solid #e5e7eb",background:"white",boxShadow:"0 1px 3px rgba(0,0,0,.06)",cursor:"pointer"}} onClick={()=>setGaleriaLightbox(f.id)}>
              <div style={{position:"relative",paddingBottom:"66%",background:"#f0f0f0"}}>
                <img src={f.dataUrl} alt={f.titulo} style={{position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"cover"}}/>
                <div style={{position:"absolute",top:6,right:6,display:"flex",gap:4}} onClick={e=>e.stopPropagation()}>
                  <button onClick={()=>eliminarFoto(f.id)} style={{width:22,height:22,borderRadius:"50%",border:"none",background:"rgba(0,0,0,.45)",color:"white",fontSize:10,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
                </div>
              </div>
              <div style={{padding:"8px 10px"}}>
                <div style={{fontSize:11,fontWeight:700,color:"#333",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{f.titulo}</div>
                <div style={{fontSize:10,color:"#888",marginTop:2}}>{nombreAliado(f.aliadoId)}{f.tipoActividad?" · "+f.tipoActividad:""}</div>
                {f.fecha&&<div style={{fontSize:10,color:"#bbb",marginTop:1}}>{new Date(f.fecha).toLocaleDateString("es-CO",{day:"numeric",month:"short",year:"numeric"})}</div>}
              </div>
            </div>
          ))}
        </div>
      ):(
        <div style={{textAlign:"center",padding:"48px 20px",color:"#bbb"}}>
          <div style={{fontSize:40,marginBottom:12}}>🖼️</div>
          <div style={{fontSize:14,fontWeight:600,marginBottom:6}}>
            {galeria.length===0?"Sin fotos registradas aún":"Sin resultados con los filtros aplicados"}
          </div>
          <div style={{fontSize:12}}>{galeria.length===0?"Haz clic en '+ Agregar foto' para comenzar a documentar las actividades.":"Intenta con otros filtros o limpialos."}</div>
        </div>
      )}

      {/* ── LIGHTBOX ── */}
      {galeriaLightbox!==null&&fotoActiva&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.88)",zIndex:2000,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}} onClick={()=>setGaleriaLightbox(null)}>
          {/* Imagen */}
          <div style={{position:"relative",maxWidth:"90vw",maxHeight:"75vh"}} onClick={e=>e.stopPropagation()}>
            <img src={fotoActiva.dataUrl} alt={fotoActiva.titulo} style={{maxWidth:"90vw",maxHeight:"75vh",objectFit:"contain",borderRadius:8,display:"block"}}/>
            {/* Navegar ← */}
            {galeriaFiltrada.length>1&&<button onClick={e=>{e.stopPropagation();navLightbox(-1);}} style={{position:"absolute",left:-48,top:"50%",transform:"translateY(-50%)",background:"rgba(255,255,255,.15)",border:"none",color:"white",fontSize:24,width:36,height:36,borderRadius:"50%",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>‹</button>}
            {/* Navegar → */}
            {galeriaFiltrada.length>1&&<button onClick={e=>{e.stopPropagation();navLightbox(1);}} style={{position:"absolute",right:-48,top:"50%",transform:"translateY(-50%)",background:"rgba(255,255,255,.15)",border:"none",color:"white",fontSize:24,width:36,height:36,borderRadius:"50%",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>›</button>}
          </div>
          {/* Info debajo */}
          <div style={{marginTop:16,textAlign:"center",color:"white",maxWidth:500}} onClick={e=>e.stopPropagation()}>
            <div style={{fontSize:15,fontWeight:700,marginBottom:4}}>{fotoActiva.titulo}</div>
            {fotoActiva.descripcion&&<div style={{fontSize:12,color:"rgba(255,255,255,.75)",marginBottom:4}}>{fotoActiva.descripcion}</div>}
            <div style={{fontSize:11,color:"rgba(255,255,255,.5)"}}>{nombreAliado(fotoActiva.aliadoId)}{fotoActiva.tipoActividad?" · "+fotoActiva.tipoActividad:""}{fotoActiva.fecha?" · "+new Date(fotoActiva.fecha).toLocaleDateString("es-CO",{day:"numeric",month:"long",year:"numeric"}):""}</div>
            <div style={{fontSize:11,color:"rgba(255,255,255,.35)",marginTop:8}}>{idxActivo+1} de {galeriaFiltrada.length} · Clic fuera para cerrar</div>
          </div>
          {/* Cerrar */}
          <button onClick={()=>setGaleriaLightbox(null)} style={{position:"fixed",top:16,right:20,background:"rgba(255,255,255,.15)",border:"none",color:"white",fontSize:20,width:36,height:36,borderRadius:"50%",cursor:"pointer"}}>✕</button>
        </div>
      )}

      {/* ── MODAL AGREGAR FOTO ── */}
      {galeriaModal&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",zIndex:1500,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
          <div style={{background:"white",borderRadius:12,padding:24,width:"100%",maxWidth:480,maxHeight:"90vh",overflowY:"auto",boxShadow:"0 8px 40px rgba(0,0,0,.2)"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
              <h3 style={{fontSize:15,fontWeight:700,color:"#333"}}>📸 Agregar fotografía</h3>
              <button onClick={()=>setGaleriaModal(false)} style={{border:"none",background:"#f5f5f5",borderRadius:6,padding:"4px 10px",cursor:"pointer",fontSize:14,color:"#666"}}>✕</button>
            </div>

            {/* Selección de imagen */}
            <div style={{marginBottom:14}}>
              <label style={{fontSize:11,fontWeight:600,color:"#555",display:"block",marginBottom:6}}>Imagen *</label>
              {galeriaForm.dataUrl?(
                <div style={{position:"relative",textAlign:"center"}}>
                  <img src={galeriaForm.dataUrl} alt="preview" style={{maxWidth:"100%",maxHeight:200,objectFit:"contain",borderRadius:8,border:"1px solid #ddd"}}/>
                  <button onClick={()=>setGaleriaForm(p=>({...p,dataUrl:""}))} style={{position:"absolute",top:6,right:6,background:"rgba(0,0,0,.5)",border:"none",color:"white",borderRadius:"50%",width:24,height:24,cursor:"pointer",fontSize:12}}>✕</button>
                </div>
              ):(
                <label style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:8,padding:24,border:"2px dashed #ddd",borderRadius:8,cursor:"pointer",background:"#fafafa",color:"#aaa",fontSize:12}}>
                  <span style={{fontSize:32}}>📷</span>
                  <span>Haz clic para seleccionar una imagen</span>
                  <input type="file" accept="image/*" style={{display:"none"}} onChange={e=>{const file=e.target.files[0];if(!file)return;comprimirImagen(file,url=>setGaleriaForm(p=>({...p,dataUrl:url})));e.target.value="";}}/>
                </label>
              )}
            </div>

            {/* Título */}
            <div style={{marginBottom:10}}>
              <label style={{fontSize:11,fontWeight:600,color:"#555",display:"block",marginBottom:4}}>Título *</label>
              <input value={galeriaForm.titulo} onChange={e=>setGaleriaForm(p=>({...p,titulo:e.target.value}))} style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"7px 10px",fontSize:12}} placeholder="Ej: Stand SLANG — Sede Bogotá"/>
            </div>

            {/* Descripción */}
            <div style={{marginBottom:10}}>
              <label style={{fontSize:11,fontWeight:600,color:"#555",display:"block",marginBottom:4}}>Descripción</label>
              <textarea value={galeriaForm.descripcion} onChange={e=>setGaleriaForm(p=>({...p,descripcion:e.target.value}))} rows={2} style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"7px 10px",fontSize:12,resize:"vertical"}} placeholder="Breve descripción de la actividad..."/>
            </div>

            {/* Fila: Aliado + Tipo */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
              <div>
                <label style={{fontSize:11,fontWeight:600,color:"#555",display:"block",marginBottom:4}}>Aliado</label>
                <select value={galeriaForm.aliadoId} onChange={e=>setGaleriaForm(p=>({...p,aliadoId:e.target.value}))} style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"7px 10px",fontSize:12}}>
                  <option value="">General del programa</option>
                  {directorio.filter(a=>a.estado==="Confirmado"||a.estado==="En Gestión").sort((a,b)=>a.empresa.localeCompare(b.empresa)).map(a=>(
                    <option key={a.id} value={a.id}>{a.empresa}</option>
                  ))}
                </select>
              </div>
              <div>
                <label style={{fontSize:11,fontWeight:600,color:"#555",display:"block",marginBottom:4}}>Tipo de actividad</label>
                <select value={galeriaForm.tipoActividad} onChange={e=>setGaleriaForm(p=>({...p,tipoActividad:e.target.value}))} style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"7px 10px",fontSize:12}}>
                  {TIPOS_ACT_GAL.map(t=><option key={t} value={t}>{t}</option>)}
                </select>
              </div>
            </div>

            {/* Fecha */}
            <div style={{marginBottom:18}}>
              <label style={{fontSize:11,fontWeight:600,color:"#555",display:"block",marginBottom:4}}>Fecha</label>
              <input type="date" value={galeriaForm.fecha} onChange={e=>setGaleriaForm(p=>({...p,fecha:e.target.value}))} style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"7px 10px",fontSize:12}}/>
            </div>

            {/* Botones */}
            <div style={{display:"flex",justifyContent:"flex-end",gap:8}}>
              <button onClick={()=>setGaleriaModal(false)} style={{padding:"8px 16px",borderRadius:6,border:"1px solid #ddd",background:"white",fontSize:12,cursor:"pointer",color:"#666"}}>Cancelar</button>
              <button onClick={guardarFoto} disabled={!galeriaForm.dataUrl||!galeriaForm.titulo.trim()} style={{padding:"8px 20px",borderRadius:6,border:"none",background:AZUL,color:"white",fontSize:12,fontWeight:700,cursor:"pointer",opacity:(!galeriaForm.dataUrl||!galeriaForm.titulo.trim())?.5:1}}>Guardar foto</button>
            </div>
          </div>
        </div>
      )}
    </div>
    );
  })()}

  <p style={{fontSize:10,color:"#ccc",textAlign:"center",marginTop:12}}>Haz clic en cada paso para marcar como completado · Los datos se mantienen durante la sesion</p>
</div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
